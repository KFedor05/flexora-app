name: Release

# Triggers only on version tags like v1.0.0, v0.0.1, v2.3.4-rc1, etc.
# Push a tag to start a release; nothing else runs this workflow.
on:
  push:
    tags:
      - "v*.*.*"

# Allow only one release run at a time, regardless of tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-release

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri bundles and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Flexora ${{ github.ref_name }}"
          releaseBody: |
            Flexora ${{ github.ref_name }}

            Download the build for your platform below.

            - **Windows:** `.exe` installer (NSIS) or `.msi`
            - **macOS:** `.dmg` (universal — Apple Silicon + Intel)
            - **Linux:** `.AppImage` (portable) or `.deb`

            > Windows: SmartScreen may warn on first launch because the build is not code-signed.
            > Click "More info" → "Run anyway". Code signing is planned for a later release.

            See the changelog for what's new.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
