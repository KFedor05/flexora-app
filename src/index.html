<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body class="flex h-screen flex-col overflow-hidden font-sans antialiased">
    <!-- CUSTOM TITLE BAR -->
    <header
      class="titlebar flex h-9 shrink-0 items-center justify-between border-b border-[var(--border)] bg-[var(--bg)] select-none"
      data-tauri-drag-region
    >
      <div
        class="flex items-center gap-2 pl-3 text-[12px] font-medium text-[var(--text-dim)]"
        data-tauri-drag-region
      >
        <img src="/logo.png" alt="" class="h-4 w-4" data-tauri-drag-region />
        <span data-tauri-drag-region>Flexora</span>
      </div>
      <div class="flex h-full items-stretch">
        <button id="win-min" class="titlebar-btn" title="Minimize" aria-label="Minimize">
          <svg
            width="10"
            height="10"
            viewBox="0 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          >
            <path d="M0 5h10" />
          </svg>
        </button>
        <button id="win-max" class="titlebar-btn" title="Maximize" aria-label="Maximize">
          <svg
            width="10"
            height="10"
            viewBox="0 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          >
            <rect x="0.5" y="0.5" width="9" height="9" />
          </svg>
        </button>
        <button
          id="win-close"
          class="titlebar-btn titlebar-btn-close"
          title="Close"
          aria-label="Close"
        >
          <svg
            width="10"
            height="10"
            viewBox="0 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
          >
            <path d="M0 0l10 10M10 0L0 10" />
          </svg>
        </button>
      </div>
    </header>

    <!-- APP BODY -->
    <div class="flex min-h-0 flex-1 overflow-hidden">
      <!-- LEFT SIDEBAR -->
      <aside
        class="sidebar flex w-60 min-h-0 shrink-0 flex-col border-r border-[var(--border)] bg-[var(--bg)] px-5 py-6"
      >
        <div class="mb-8 flex items-center gap-2.5 px-1">
          <img src="/logo.png" alt="" class="h-9 w-9" />
          <span class="text-lg font-extrabold tracking-tight">Flexora</span>
        </div>

        <button
          data-action="open-settings"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-[var(--text-dim)] transition hover:bg-[var(--bg-elev)] hover:text-[var(--text)]"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span data-i18n="sidebar.settings">Settings</span>
        </button>
      </aside>

      <!-- MAIN CONTENT -->
      <main
        id="main-content"
        class="min-w-0 min-h-0 flex-1 overflow-y-auto px-4 py-5 sm:px-6 sm:py-6 md:px-8 lg:px-10 lg:py-8"
      ></main>

      <!-- RIGHT PANEL — owned by Today view; hidden on Editor -->
      <aside
        id="right-panel"
        class="flex w-[340px] min-h-0 shrink-0 flex-col border-l border-[var(--border)] bg-[var(--bg)]"
      ></aside>
    </div>
  </body>
</html>
