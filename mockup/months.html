<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flexora — Месяцы года</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0a0b12;
    --bg-modal: #0f111a;
    --surface: #161924;
    --border: #1d2030;
    --border-strong: #252938;
    --text: #e7e9f0;
    --text-muted: #8b8fa3;
    --text-subtle: #6b7080;
    --accent: #4a90ff;
    --accent-soft: rgba(74, 144, 255, 0.15);
    --accent-border: rgba(74, 144, 255, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Left sidebar */
  .leftbar {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid var(--surface);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 32px;
    padding: 0 4px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 18px;
  }
  .logo-text { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .sidebar-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text-muted);
    background: transparent; border: none;
    text-align: left; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500;
    transition: all 0.15s;
  }
  .sidebar-btn:hover { background: var(--surface); color: var(--text); }

  /* Main */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 60px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .page-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .date-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bg-modal);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .nav-btn {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    transition: all 0.15s;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn:hover { background: var(--surface); border-color: var(--border-strong); }
  .nav-btn.muted { color: var(--text-muted); }
  .nav-btn-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn-circle:hover { background: #3b7eee; transform: scale(1.04); }

  .hint {
    font-size: 13px;
    color: var(--text-subtle);
    margin: 6px 0 28px;
  }

  .year-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    font-weight: 600;
    margin-bottom: 14px;
  }

  /* Month list */
  .month-list { display: flex; flex-direction: column; gap: 4px; }
  .month-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .month-row:hover {
    background: var(--surface);
    border-color: var(--border-strong);
    transform: translateX(2px);
  }
  .month-row.current {
    background: rgba(74, 144, 255, 0.12);
    border-color: var(--accent-border);
    box-shadow: 0 0 0 1px rgba(74, 144, 255, 0.15);
  }
  .month-icon {
    width: 22px;
    height: 22px;
    color: var(--text-subtle);
    flex-shrink: 0;
  }
  .month-row.current .month-icon { color: #8ab9ff; }
  .month-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .month-row.current .month-name { color: #b4d2ff; }

  .month-stat {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-subtle);
    font-weight: 500;
  }
  .month-stat .stat-mini {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .month-stat .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .month-stat .dot.green  { background: #5cd07e; }
  .month-stat .dot.orange { background: #ffae5c; }
  .month-stat .dot.red    { background: #e07070; }

  .current-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(74, 144, 255, 0.18);
    color: #8ab9ff;
  }
</style>
</head>
<body>

<div class="app">

  <!-- LEFT SIDEBAR -->
  <aside class="leftbar">
    <div class="logo">
      <div class="logo-icon">F</div>
      <div class="logo-text">Flexora</div>
    </div>
    <button class="sidebar-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Настройки
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="page-header">
      <div class="title-row">
        <h1 class="page-title">Ежедневник</h1>
        <div class="date-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          2026
        </div>
      </div>
      <div class="header-actions">
        <button class="nav-btn muted">Назад</button>
        <button class="nav-btn">Предыдущий год</button>
        <button class="nav-btn muted">Следующий год</button>
        <button class="nav-btn">Сегодня</button>
        <button class="nav-btn">По дням</button>
        <button class="nav-btn-circle" title="Новая привычка">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="hint">Нажмите на месяц, чтобы открыть его дни.</div>

    <h2 class="year-title">2026</h2>
    <div class="section-label">Месяцы</div>

    <div class="month-list">
      <div class="month-row">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">январь 2026 г.</span>
        <span class="month-stat">
          <span class="stat-mini"><span class="dot green"></span> 8</span>
          <span class="stat-mini"><span class="dot orange"></span> 14</span>
          <span class="stat-mini"><span class="dot red"></span> 9</span>
        </span>
      </div>

      <div class="month-row">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">февраль 2026 г.</span>
        <span class="month-stat">
          <span class="stat-mini"><span class="dot green"></span> 12</span>
          <span class="stat-mini"><span class="dot orange"></span> 10</span>
          <span class="stat-mini"><span class="dot red"></span> 6</span>
        </span>
      </div>

      <div class="month-row">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">март 2026 г.</span>
        <span class="month-stat">
          <span class="stat-mini"><span class="dot green"></span> 18</span>
          <span class="stat-mini"><span class="dot orange"></span> 9</span>
          <span class="stat-mini"><span class="dot red"></span> 4</span>
        </span>
      </div>

      <div class="month-row">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">апрель 2026 г.</span>
        <span class="month-stat">
          <span class="stat-mini"><span class="dot green"></span> 21</span>
          <span class="stat-mini"><span class="dot orange"></span> 7</span>
          <span class="stat-mini"><span class="dot red"></span> 2</span>
        </span>
      </div>

      <div class="month-row">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">май 2026 г.</span>
        <span class="month-stat">
          <span class="stat-mini"><span class="dot green"></span> 19</span>
          <span class="stat-mini"><span class="dot orange"></span> 8</span>
          <span class="stat-mini"><span class="dot red"></span> 4</span>
        </span>
      </div>

      <div class="month-row current">
        <svg class="month-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span class="month-name">июнь 2026 г.</span>
        <span class="current-badge">ТЕКУЩИЙ</span>
      </div>
    </div>

    <div class="hint" style="margin-top: 24px; font-style: italic; opacity: 0.6;">Следующие месяцы появятся, когда наступят.</div>

  </main>

</div>

</body>
</html>
